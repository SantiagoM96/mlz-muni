name: Verificación frontend
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar dependencias de generación de íconos
        run: python -m pip install --disable-pip-version-check -r requirements-fonts.txt
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:architecture
      - run: npm run check:architecture
      - run: npm run check:styles
      - run: npm run audit:styles
      - run: npm run build
      - run: npm run report:css
