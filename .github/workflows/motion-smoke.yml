name: Validación enfocada — Motion Agenda

# La suite E2E general ya incluye motion-smoke.spec.ts en las cuatro resoluciones.
# Mantener este workflow solo para diagnósticos rápidos solicitados manualmente.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  motion-smoke:
    name: Motion desktop y mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Compilar
        run: npm run build
      - name: Probar interacciones
        run: npx playwright test tests/e2e/motion-smoke.spec.ts --project=desktop-1415 --project=mobile-432 --project=mobile-390 --project=tablet-768 --workers=3 --retries=0 --reporter=list
        env:
          CI: 'true'
      - name: Guardar capturas de fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: motion-smoke-errors
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
