name: QA visual — Chromium y Playwright

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # PRs conservan cobertura completa; push a main ejecuta E2E solo si afecta a la web.
    paths:
      - 'src/**'
      - 'requirements-fonts.txt'
      - 'public/assets/**'
      - 'tests/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'playwright.config.ts'
      - 'playwright.parity.config.ts'
      - 'tsconfig*.json'
      - 'eslint.config.js'
      - '.github/workflows/**'

permissions:
  contents: read

# Los pushes sucesivos al mismo PR sustituyen ejecuciones E2E obsoletas.
# Los pushes a main no se cancelan y conservan su trazabilidad.
concurrency:
  group: visual-qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  playwright:
    name: Chromium — ${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-1415, mobile-432, mobile-390, tablet-768]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar dependencias de generación de íconos
        run: python -m pip install --disable-pip-version-check -r requirements-fonts.txt
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Instalar Chromium y librerías del sistema
        run: npx playwright install --with-deps chromium
      - name: Verificar el build
        run: npm run build
      - name: Ejecutar pruebas y capturas
        run: npm run test:e2e -- --project=${{ matrix.project }} --retries=0
        env:
          CI: 'true'
      - name: Publicar capturas y reporte HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
