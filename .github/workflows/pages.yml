name: Publicar preview institucional MLZ
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/prepare-pages.mjs'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mlz-muni-github-pages
  cancel-in-progress: true

jobs:
  publish:
    name: Compilar y publicar en GitHub Pages
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias fijadas
        run: npm ci --no-audit --no-fund
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Verificar ESLint
        run: npm run lint
      - name: Compilar para /mlz-muni/
        run: npm run build:pages
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Subir artefacto de sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publicar preview
        id: deployment
        uses: actions/deploy-pages@v4
