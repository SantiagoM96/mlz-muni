name: Publicar preview institucional MLZ
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mlz-muni-github-pages-v2
  cancel-in-progress: true

jobs:
  publish:
    name: Compilar y publicar en GitHub Pages
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar dependencias de generación de íconos
        run: python -m pip install --disable-pip-version-check -r requirements-fonts.txt
      - name: Instalar dependencias fijadas
        run: npm ci --no-audit --no-fund
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Verificar ESLint
        run: npm run lint
      - name: Recuperar fotografías originales de tarjetas
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p public/assets/andy-cards
          if curl --fail --location --silent --show-error --retry 2 --max-time 30 'https://lomasdezamora.gov.ar/gestion/salud-lomas.webp' -o /tmp/mlz-salud.webp && [ "$(wc -c </tmp/mlz-salud.webp)" -gt 25000 ]; then
            cp /tmp/mlz-salud.webp public/assets/andy-cards/salud-lomas.webp
            echo "Salud Lomas: fotografía original de alta resolución"
          else
            echo "::warning::No se pudo actualizar Salud Lomas; se conserva el recurso local"
          fi
          if curl --fail --location --silent --show-error --retry 2 --max-time 30 'https://agenciacomunas.com.ar/wp-content/uploads/2026/11/13112026042411p.m-780x470.jpg' -o /tmp/mlz-obras.jpg && [ "$(wc -c </tmp/mlz-obras.jpg)" -gt 18000 ]; then
            cp /tmp/mlz-obras.jpg public/assets/andy-cards/noticia-obras.jpg
            echo "Noticias: fotografía original en resolución editorial"
          else
            echo "::warning::No se pudo actualizar Noticias; se conserva el recurso local"
          fi
      - name: Compilar para /mlz-muni/
        run: npm run build:pages
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Subir artefacto de sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publicar preview
        id: deployment
        uses: actions/deploy-pages@v4
