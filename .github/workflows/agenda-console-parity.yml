name: Paridad visual — Consola Agenda V2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/agenda-console-parity.yml'
      - 'tests/visual-parity/agenda-console-parity.spec.ts'
      - 'playwright.parity.config.ts'
      - 'src/pages/agenda/**'
      - 'src/features/agenda/**'
      - 'src/components/agenda/**'
      - 'src/data/agenda**'
      - 'src/styles/**'
      - 'src/shared/**'
      - 'src/modules/agenda/**'
      - 'scripts/fonts/**'
      - 'requirements-fonts.txt'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'

permissions:
  contents: read

concurrency:
  group: agenda-parity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    # No se requieren permisos de escritura ni secretos para capturas visuales.
    name: Paridad baseline — ${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-1415, mobile-432, mobile-390, tablet-768]
    steps:
      - name: Checkout del código candidato (PR)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate

      - name: Checkout del origen MLZ fijado para la migración
        if: github.head_ref == 'migration/institutional-frontend-v2'
        uses: actions/checkout@v4
        with:
          repository: SantiagoM96/mlz
          ref: adc097b3fd6f129e7994b67b24cce46edc2b608b
          path: baseline
          persist-credentials: false

      - name: Checkout de main para futuros PR
        if: github.head_ref != 'migration/institutional-frontend-v2'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: candidate/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar herramientas para generar la fuente candidata
        run: python -m pip install --disable-pip-version-check -r candidate/requirements-fonts.txt

      - name: Instalar candidato
        working-directory: candidate
        run: npm ci --no-audit --no-fund

      - name: Instalar referencia
        working-directory: baseline
        # Durante el primer PR del lockfile, main todavía puede no tenerlo.
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Instalar Chromium
        working-directory: candidate
        run: npx playwright install --with-deps chromium

      - name: Iniciar referencia y candidato
        shell: bash
        run: |
          set -euo pipefail
          nohup npm --prefix baseline run dev -- --host 127.0.0.1 --port 4174 --strictPort > baseline-server.log 2>&1 &
          nohup npm --prefix candidate run dev -- --host 127.0.0.1 --port 4173 --strictPort > candidate-server.log 2>&1 &
          for attempt in {1..90}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4174/agenda-de-la-comunidad/consola-preview \
              && curl --fail --silent --output /dev/null http://127.0.0.1:4173/agenda-de-la-comunidad/consola-preview; then
              exit 0
            fi
            sleep 1
          done
          cat baseline-server.log candidate-server.log
          exit 1

      - name: Generar referencia visual temporal
        working-directory: candidate
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4174
        run: npx playwright test --config=playwright.parity.config.ts --project=${{ matrix.project }} --update-snapshots --retries=0

      - name: Comparar visualmente origen y destino
        working-directory: candidate
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test --config=playwright.parity.config.ts --project=${{ matrix.project }} --retries=0

      - name: Conservar capturas, diferencias y logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenda-parity-${{ matrix.project }}
          path: |
            candidate/tests/visual-parity/agenda-console-parity.spec.ts-snapshots/
            candidate/test-results/
            candidate/playwright-report/
            baseline-server.log
            candidate-server.log
          if-no-files-found: warn
          retention-days: 14
